version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node -v
        - npm ci
    build:
      commands:
        - env | grep -E '^API_BASE_URL=' >> .env
        - echo "----- .env file contents -----"
        - cat .env
        - npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
