name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # CI only verifies the build — it never deploys or calls these APIs.
      # Placeholders keep $env/static/private non-empty when the repo
      # variables are unset; real values are injected by Amplify at deploy.
      API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://ci-placeholder.invalid' }}
      INVOICE_API_BASE_URL: ${{ vars.INVOICE_API_BASE_URL || 'https://ci-placeholder.invalid' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run check --if-present

      - name: Build
        run: npm run build
